name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: macos-15,       r: 'release'}  # ARM64
          - {os: windows-latest, r: 'release'}
          - {os: windows-11-arm, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'clang23',  container: 'ghcr.io/r-hub/containers/clang23:latest'}
          - {os: ubuntu-latest,  r: 'gcc13',    container: 'ghcr.io/r-hub/containers/gcc13:latest'}
          - {os: ubuntu-latest,  r: 'valgrind', container: 'ghcr.io/r-hub/containers/valgrind:latest'}
          - {os: ubuntu-latest,  r: 'rchk',     container: 'ghcr.io/r-hub/containers/rchk:latest'}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !matrix.config.container }}
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # R CMD check needs checkbashisms for the `cleanup` script; the r-hub
      # containers do not ship it (Ubuntu: devscripts, Fedora: devscripts-checkbashisms)
      - name: Install checkbashisms
        if: ${{ matrix.config.container }}
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends devscripts
          elif command -v dnf >/dev/null; then
            dnf install -y devscripts-checkbashisms
          fi

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Diagnostics for the Box2D segment AABB failure on Linux (test-box2d.R):
      # the exact compiler and flags R builds the package with
      - name: Show compiler configuration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          R CMD config CC; R CMD config CFLAGS; R CMD config CPPFLAGS
          R CMD config CXX17; R CMD config CXX17FLAGS
          grep -iE 'lto|march|mtune' "$(R RHOME)/etc/Makeconf" || true
          gcc -v 2>&1 | tail -3 || true
          gcc -Q --help=target 2>/dev/null | grep -E '^\s+-march=|^\s+-mtune=' || true

      # Diagnostics for the gcc 15 / x86-64-v3 miscompile (see ./configure):
      # Box2D's geometry.c for x86-64-v3 without and with -fno-tree-slp-vectorize,
      # and the count of vfmaddsub instructions that multiply a register by
      # itself (the miscompile); 0 expected with the flag
      - name: Assemble Box2D geometry.c (release only)
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && !matrix.config.container
        shell: bash
        run: |
          mkdir -p asm
          F="-g -O2 -fpic -DNDEBUG -DBOX2D_DISABLE_SIMD -DB2_ENABLE_ASSERT -Isrc/box2d/include -I$(R RHOME)/include -march=x86-64-v3"
          gcc $F -S src/box2d/src/geometry.c -o asm/geometry-x86-64-v3.s
          gcc $F -fno-tree-slp-vectorize -S src/box2d/src/geometry.c -o asm/geometry-x86-64-v3-noslp.s
          for s in asm/*.s; do
            n=$(awk '/vfm(addsub|subadd)[0-9]+ps/ { s = $2 $3 $4; gsub(/ /, "", s); split(s, a, ","); if (a[1] == a[3]) n++ } END { print n + 0 }' "$s")
            echo "$s: $n self-multiplying vfmaddsub"
          done

      - name: Upload Box2D assembly (release only)
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && !matrix.config.container
        uses: actions/upload-artifact@v4
        with:
          name: box2d-geometry-asm
          path: asm/

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
